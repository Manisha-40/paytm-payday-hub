function setup(){return header('Set up your month','intro')+`<div class="content">${steps(1)}<h2 class="intro-heading" style="font-size:23px">Start your way.</h2><p class="intro-copy">Add one regular payment, or explore how a detection flow could work.</p><button class="choice recommended" data-action="manual-setup"><span class="round-icon">${icon('edit')}</span><span><strong>Add payments manually</strong><small>Enter the details yourself. No account access.<br>Recommended for this demo</small></span><span class="arrow">›</span></button><button class="choice" data-detect="sms"><span class="round-icon">${icon('phone')}</span><span><strong>Try SMS suggestions</strong><small>Preview with fictional messages.<br>Does not read your SMS.</small></span><span class="arrow">›</span></button><button class="choice" data-detect="aa"><span class="round-icon">${icon('bank')}</span><span><strong>Try account-data suggestions</strong><small>Illustrative Account Aggregator consent.<br>No bank connection is made.</small></span><span class="arrow">›</span></button><div class="note">All three paths work as a demonstration. You can use Payday Hub without linking your salary account.</div>${footer()}</div>`;}
function detect(){const source=setupMethod==='sms'?'SMS':'account data';return header('Review suggestions','setup')+`<div class="content">${steps(1)}<div class="card"><span class="banner-mark">FICTIONAL ${source.toUpperCase()}</span><h2 style="margin-top:14px">Nothing is added for you.</h2><p>Choose which sample payments belong in your plan. You can edit each one later.</p><label class="check"><input type="checkbox" id="demo-consent">I understand these are sample suggestions. No messages or bank data are accessed.</label>${P.suggested(model.today).map(o=>`<label class="check" style="border-top:1px solid #edf0f4;padding-top:13px"><input type="checkbox" name="suggestion" value="${o.id}" ${setupSelection.has(o.id)?'checked':''}><span class="grow"><strong>${o.name} · ${money(o.amount)}</strong><br>${o.payee} · Due ${dl(o.date)}<br><span class="status external">${o.tag}</span></span></label>`).join('')}${formError()}<button class="primary" data-action="save-detected">Continue with selected payments</button></div><button class="secondary" data-action="manual-setup">Add a payment myself</button>${footer()}</div>`;}
function salary(){return header('Make it your month',model.onboarded?'preferences':'setup')+`<div class="content">${model.onboarded?'':steps(2)}<h2 class="intro-heading" style="font-size:24px">When is your payday?</h2><p class="intro-copy">Optional. A date helps shape your monthly routine. You don’t need to connect a salary account.</p><form id="salary-form" class="card"><label class="field"><span>Salary day (optional)</span><select name="payday"><option value="">Use calendar month</option>${Array.from({length:31},(_,i)=>`<option ${model.settings.payday===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label><label class="field"><span>Monthly income (₹, optional)</span><input name="income" type="text" inputmode="decimal" placeholder="e.g. 85000" value="${model.incomes[0]?.amount/100||''}"></label><div class="note">Income is a manual record. We cannot detect a salary credit or verify your bank balance in this demo.</div>${formError()}<button class="primary" type="submit">Continue</button><button class="link" style="width:100%" type="button" data-action="skip-salary">Skip for now</button></form>${footer()}</div>`;}
function review(){const os=P.occurrences(model,P.monthKey(model.today)),s=P.stats(model);return header('Your plan is ready','salary')+`<div class="content">${steps(3)}<div class="card"><div class="between"><span class="round-icon">${icon('calendar')}</span><span class="banner-mark">${os.length} PLANNED</span></div><h2 style="margin-top:18px">A clearer month starts here.</h2><p>Review your plan. Payments only happen when you choose to pay.</p><div class="amount">${money(s.total)}</div><div class="label">Planned for ${P.monthLabel(model.today)}</div>${os.map(o=>`<div class="detail"><span>${E(o.name)} · ${dl(o.date)}</span><span>${money(o.amount)}<br><small>${E(o.tag)}</small></span></div>`).join('')}<button class="link" data-action="add-during-setup">＋ Add another payment</button></div><div class="note">No automatic payments were created. Set reminders or pay from your plan.</div><button class="primary" data-action="finish-setup">Open my Payday Hub</button>${footer()}</div>`;}
function hub(){const s=P.stats(model),os=s.os.filter(o=>P.outstanding(model,o)>0).slice(0,2),overdue=s.os.filter(o=>o.date<model.today&&P.outstanding(model,o)>0);return header('Payday Hub','home',`<button class="icon-btn" data-nav="preferences" aria-label="Plan settings">${icon('settings')}</button>`)+`<div class="content"><div class="hero-month"><div><div class="label">${P.monthLabel(model.today)}</div><h2>Your month, in view.</h2><div class="subtitle">One payment at a time. You’re in control.</div></div><span class="month-icon">${icon('calendar')}</span></div><div class="balance-grid"><button class="stat primary-stat" data-nav="payments"><div class="label">Planned this month</div><div class="amount">${money(s.total)}</div><small>${s.os.length} scheduled payments →</small></button><button class="stat" data-action="due-list"><div class="label">Due in next 7 days</div><div class="amount">${money(s.dueTotal)}</div><small>${s.due.length} unpaid payments →</small></button></div>${overdue.length?`<div class="mini-banner">${icon('clock')}<div><strong>${overdue.length} overdue payment${overdue.length>1?'s':''}</strong>Check your plan before paying again.</div></div>`:''}<div class="card"><div class="between"><h2>Coming up next</h2><button class="link" data-nav="payments">See all →</button></div>${os.length?os.map(o=>row(o)).join(''):empty('All caught up.','No unpaid planned payments this month.')}<button class="link" data-action="add-payment">＋ Add a payment</button></div><div class="card"><div class="between"><h3>What’s left in your plan</h3><button class="link" data-nav="summary">View details →</button></div><div class="amount sm">${model.incomes.length?money(s.plannedAfter):"Income not added"}</div><p>${model.incomes.length?"Recorded income − recorded spending − unpaid planned payments.":"Your payment plan works without income details. Add income only if you want a planning estimate."}</p><div class="note" style="margin-bottom:0">A planning estimate, not your bank balance or a safe-to-spend recommendation. Includes only information recorded here. SIPs and goals are not deducted.</div></div><div class="card"><div class="between"><h3>Reminders</h3><button class="link" data-nav="reminders">Manage →</button></div><p>${model.reminders.filter(r=>r.active).length} active demo reminders. Pick a payment to set one.</p></div><div class="card"><div class="between"><h3>Goals & SIP schedule</h3><button class="link" data-nav="goals">View →</button></div><div class="list-row"><span class="round-icon">${icon('goal')}</span><div class="grow"><div class="row-name">Goa trip</div><div class="row-meta">Your goal · view only</div></div><div class="right"><strong>${Math.round(model.goals[0].saved/model.goals[0].target*100)}%</strong></div></div><div class="between"><span class="label">SIP · ${dl(model.sip.date)}</span><strong style="font-size:12px">${money(model.sip.amount)}</strong></div></div><button class="secondary" data-nav="month-close">Review my month</button>${footer()}</div>`;}
function payments(){const s=P.stats(model);let os=s.os;if(filterMode==='due')os=os.filter(o=>o.date>=model.today&&o.date<=P.plusDays(model.today,6)&&P.outstanding(model,o)>0);if(filterMode==='unpaid')os=os.filter(o=>P.outstanding(model,o)>0);if(filterMode==='paid')os=os.filter(o=>!P.outstanding(model,o));return header('Planned payments','hub',`<button class="icon-btn" data-action="add-payment" aria-label="Add payment">${icon('plus')}</button>`)+`<div class="content"><div class="balance-grid"><div class="stat primary-stat"><div class="label">Planned total</div><div class="amount">${money(s.total)}</div><small>All scheduled payments</small></div><div class="stat"><div class="label">Left to pay</div><div class="amount">${money(s.remaining)}</div><small>After recorded settlements</small></div></div><div class="segmented">${[['all','All'],['due','Next 7 days'],['unpaid','Unpaid'],['paid','Paid']].map(([v,l])=>`<button class="${filterMode===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div><div class="between"><span class="label">${P.monthLabel(model.today)}</span><button class="link" data-action="toggle-filters">Filter amount & date</button></div><form class="card filter-panel" id="filter-form"><div class="field-grid"><label class="field"><span>Min amount (₹)</span><input name="min" inputmode="decimal" placeholder="Any"></label><label class="field"><span>Max amount (₹)</span><input name="max" inputmode="decimal" placeholder="Any"></label><label class="field"><span>Due from</span><input name="from" type="date"></label><label class="field"><span>Due to</span><input name="to" type="date"></label></div>${formError()}<div class="form-actions"><button class="primary small-btn" type="submit">Apply</button><button class="secondary small-btn" type="button" data-action="clear-filters">Reset</button></div></form><div class="card" id="payment-rows">${os.length?os.map(o=>row(o,{manage:true})).join(''):empty('No payments here.','Add a payment or choose another view.')}</div><button class="secondary" data-action="add-payment">${icon('plus')} Add a payment</button>${footer('Paid elsewhere records reduce your plan, but never count as Paytm payments.')}</div>`;}
function add(){const edit=model.obligations.find(o=>o.id===params.edit),v=edit||{name:'',payee:'',recipient:'',amount:'',date:P.plusDays(model.today,1),frequency:'Monthly',tag:'Home',note:''};return header(edit?'Edit payment':'Add a payment',setupManual?'setup':'payments')+`<div class="content">${setupManual?steps(1):''}<div class="note">Use fictional details. A real Paytm integration would verify the recipient through its native payment flow.</div><form id="obligation-form" class="card"><label class="field"><span>Payment name</span><input name="name" required maxlength="65" value="${E(v.name)}" placeholder="e.g. Rent"></label><label class="field"><span>Recipient name</span><input name="payee" required maxlength="65" value="${E(v.payee)}" placeholder="e.g. Meena Sharma"></label><label class="field"><span>Fictional UPI ID</span><input name="recipient" required maxlength="90" value="${E(v.recipient)}" placeholder="e.g. meena.rent@demo" autocomplete="off"></label><label class="field"><span>Amount (₹)</span><input name="amount" required inputmode="decimal" value="${v.amount?v.amount/100:''}" placeholder="e.g. 22000"></label><div class="field-grid"><label class="field"><span>First due date</span><input name="date" type="date" required value="${E(v.date)}"></label><label class="field"><span>Frequency</span><select name="frequency">${['Monthly','Weekly','Quarterly','Once'].map(f=>`<option ${v.frequency===f?'selected':''}>${f}</option>`).join('')}</select></label></div><label class="field"><span>Tag</span><select name="tag">${P.TAGS.map(t=>`<option ${v.tag===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>Note (optional)</span><input name="note" maxlength="160" value="${E(v.note)}" placeholder="Only for your reference"></label>${formError()}<button type="submit" class="primary">${setupManual?'Save & continue':'Save payment'}</button><button class="link" type="button" style="width:100%" data-nav="${setupManual?'setup':'payments'}">Cancel</button></form>${footer('For dates on the 29th–31st, a shorter month uses its last day.')}</div>`;}
function reminder(){let o;try{o=P.resolveOccurrence(model,params.id);}catch{return header('Payment reminder','hub')+`<div class="content">${empty('This payment changed.','Open your plan to choose another payment.')}<button class="primary" data-nav="payments">Open my plan</button></div>`;}const remaining=P.outstanding(model,o);return header('Payment reminder','hub')+`<div class="content"><div class="reminder-hero"><span class="round-icon">${icon('bell')}</span><h2>A little heads-up.</h2><p>${E(o.name)} is ${o.date<model.today?'overdue':o.date===model.today?'due today':'due '+dl(o.date)}.<br>Review it now, pay when you’re ready.</p></div><div class="card"><div class="flex"><span class="round-icon">${icon(tagIcon(o.tag))}</span><div class="grow"><h3>${E(o.name)}</h3><div class="subtitle">${E(o.payee)}</div></div>${statusBadge(P.occurrenceStatus(model,o))}</div><div class="amount" style="margin-top:22px">${money(remaining)}</div><div class="label">Outstanding · ${E(o.tag)}</div><div class="detail"><span>Recipient ID</span><span>${E(o.recipient)}</span></div><div class="detail"><span>Due date</span><span>${dl(o.date,true)}</span></div><div class="note">Recipient, balance and limit checks are simulated. Actual availability is determined inside the authorized payment flow.</div>${remaining?`<button class="primary" data-pay="${o.id}">Review & pay ${money(remaining)}</button><button class="secondary" data-schedule="${o.id}">Remind me later</button><button class="link" style="width:100%" data-external="${o.id}">I already paid elsewhere</button>`:`<button class="primary" data-nav="hub">Back to my month</button>`}</div>${footer('This is a reminder preview. No notification has been sent.')}</div>`;}
function reminders(){const rs=model.reminders.filter(r=>r.active),saved=(model.savedReminders||[]).filter(r=>r.active);return header('My reminders','hub')+`<div class="content"><div class="note">Schedules save in this browser. This prototype does not send push or local notifications.</div><div class="card">${saved.map(r=>`<div class="list-row"><span class="round-icon">${icon('bell')}</span><div class="grow"><div class="row-name">${E(r.name)}</div><div class="row-meta">${dl(r.date)} · Saved reminder · Not in the plan</div></div><div class="row-amount">${money(r.amount)}</div></div>`).join('')}${rs.length?rs.map(r=>{let o;try{o=P.resolveOccurrence(model,r.occurrenceId)}catch{return ''}return `<div class="list-row"><span class="round-icon">${icon('bell')}</span><div class="grow"><div class="row-name">${E(o.name)}</div><div class="row-meta">${dl(r.date)} · ${r.time} IST<br>Due ${dl(o.date)}</div><button class="link" data-schedule="${r.occurrenceId}">Edit time</button> &nbsp; <button class="link" data-cancel-reminder="${r.id}">Cancel</button></div><button class="pay-link" data-reminder="${o.id}">Preview</button></div>`}).join(''):saved.length?'':empty('No reminders yet.','Choose a planned payment and set a date and time.')}<button class="secondary" data-nav="payments">Choose a payment</button></div>${footer()}</div>`;}
function pay(){if(!draft)return header('Payment','home')+`<div class="content">${empty('Choose who to pay.','Start with a planned payment or a sample contact.')}<button class="primary" data-nav="payments">View planned payments</button><button class="secondary" data-entry="phone">Choose a demo contact</button></div>`;return header('Review payment','payments')+`<div class="content white"><div class="payee"><span class="recipient-avatar">${E(draft.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><h2>${E(draft.name)}</h2><div class="verified">${icon('shield')} Demo recipient · identity check simulated</div><div class="label">${E(draft.recipient)}</div></div><form id="payment-form"><label class="pay-amount-label">₹<input name="amount" class="pay-amount" aria-label="Payment amount in rupees" inputmode="decimal" required value="${draft.amount?draft.amount/100:''}" placeholder="0"></label>${draft.occurrenceId?`<p class="tiny muted" style="text-align:center">${E(draft.label)} · You can part-pay the outstanding amount.</p>`:''}<div class="chips" style="justify-content:center">${P.TAGS.map(t=>`<button type="button" class="chip ${draft.tag===t?'active':''}" data-pay-tag="${t}">${t}</button>`).join('')}</div><label class="field"><span>Note (optional)</span><input name="note" maxlength="160" placeholder="Add a note" value="${E(draft.note||'')}"></label><div class="note">Simulation only. Review the recipient and amount before continuing. Never enter a real UPI PIN.</div>${formError()}<button class="primary" type="submit">${icon('shield')} Proceed securely</button><button class="link" type="button" style="width:100%" data-action="cancel-payment">Cancel payment</button></form>${footer()}</div>`;}
function statusView(){const a=model.attempts.find(a=>a.id===params.id);if(!a)return header('Payment status','hub')+`<div class="content">${empty('No payment to check.','Open your plan to start a new demo payment.')}</div>`;if(a.status==='success'){const t=model.transactions.find(t=>t.attemptId===a.id);return receipt(t?.id)}const pending=a.status==='pending';return header('Payment status','hub')+`<div class="content white"><div class="state-art ${pending?'':'failed'}">${icon(pending?'clock':'close')}</div><h2 class="state-heading">${pending?'Payment pending':'Payment not completed'}</h2><p class="state-copy">${pending?'We don’t have a final result yet.<br>Check this attempt before paying again.':'This demo attempt failed.<br>Your plan still shows the amount unpaid.'}</p><div class="amount" style="text-align:center;margin:24px 0">${money(a.amount)}</div><div class="card"><div class="detail"><span>To</span><span>${E(a.name)}</span></div><div class="detail"><span>Demo attempt</span><span>${E(a.id.slice(-12))}</span></div><div class="detail"><span>Plan status</span><span>${pending?'Pending — retry blocked':'Unpaid — safe to start a new demo attempt'}</span></div></div>${pending?`<button class="primary" data-resolve="${a.id}" data-result="success">Simulate final success</button><button class="secondary" data-resolve="${a.id}" data-result="failed">Simulate final failure</button>`:`<button class="primary" data-retry="${a.id}">Review & try again</button>`}<button class="link" style="width:100%" data-nav="hub">Back to my month</button><div class="note">No bank debit, money movement or refund occurs in this prototype. A real flow needs provider-confirmed status and support.</div></div>`;}
function receipt(txId=params.id){const t=model.transactions.find(t=>t.id===txId);if(!t)return header('Payment details','history')+`<div class="content">${empty('Payment unavailable.','Choose a payment from Balance & History.')}</div>`;return header('Payment details','history',`<button class="icon-btn" data-action="receipt-more" aria-label="More receipt options">⋮</button>`)+`<div class="content" style="background:linear-gradient(#edf5ff,#f5f6f8 350px)"><div class="receipt-top"><div class="wordmark">pay<span>tm</span></div><div class="receipt-check">${icon('check')}</div><h2>${t.method==='Paytm'?'Payment successful':'Recorded as paid elsewhere'}</h2><div class="label">${E(t.name)}</div><div class="receipt-amount">${money(t.amount)}</div><div class="tiny muted">${dl(t.date,true)} · Demo transaction</div><div class="receipt-actions"><button class="secondary" data-action="check-balance">Check Balance</button>${t.occurrenceId?'':`<button class="secondary" data-pay-again="${t.id}">Pay Again</button>`}<button class="secondary" data-download="${t.id}">Save receipt</button></div></div><div class="card"><div class="between"><div><h3>${t.confirmed?'Payment tagged':'Suggested tag'}</h3><p>${E(t.tag)}${t.confirmed?' · Confirmed':' · Based on demo merchant information'}</p></div><button class="chip active" data-tag-tx="${t.id}">${E(t.tag)} ›</button></div>${t.confirmed?'':`<button class="link" data-confirm-tag="${t.id}">Confirm ${E(t.tag)} tag</button>`}<p class="tiny muted">Your payment is saved even if you skip tagging.</p></div><div class="card"><div class="detail"><span>To</span><span>${E(t.name)}<br>${E(t.recipient)}</span></div><div class="detail"><span>From</span><span>${E(t.bank||'Manual external record')}</span></div><div class="detail"><span>Demo reference</span><span>DEMO-${E(t.id.slice(-12).toUpperCase())}</span></div>${t.note?`<div class="detail"><span>Note</span><span>${E(t.note)}</span></div>`:''}${t.occurrenceId?`<div class="detail"><span>Plan updated</span><span>${E(settlementDescription(t.occurrenceId))}</span></div>`:''}</div><button class="hub-entry" data-nav="hub"><span class="tile-icon">${icon('calendar')}</span><span><strong>${model.onboarded?'Back to your monthly plan':'Make next month a little easier'}</strong><small>${model.onboarded?'Your payment and plan are in sync.':'Add rent, family and help to Payday Hub.'}</small></span><span class="arrow">›</span></button><button class="secondary" data-nav="history">View payment history</button>${footer('Demo receipt only. This is not proof of payment or a tax document.')}</div>`;}
function settlementDescription(key){try{const o=P.resolveOccurrence(model,key),left=P.outstanding(model,o);return left?money(left)+' still to pay':'This occurrence is settled';}catch{return 'Original plan has changed';}}

function summary(){const s=P.stats(model,selectedMonth),base=P.monthKey(model.today),months=Array.from({length:6},(_,i)=>{const d=new Date(base+'-01T12:00Z');d.setUTCMonth(d.getUTCMonth()-i);return d.toISOString().slice(0,7)});const colors=['#4b99d2','#9cc6e4','#6dbeb5','#b7d8ef','#7da7d4','#b7cbd9','#d9e9f6','#aac5c5'];let cum=0;const gradient=s.categories.map((c,i)=>{const start=cum;cum+=c.amount/(s.out||1)*100;return colors[i%colors.length]+` ${start}% ${cum}%`}).join(',')||'#e9eef4 0% 100%';return header('Monthly AI Spend Summary','history')+`<div class="content white"><div class="summary-tabs">${months.map(m=>`<button class="${m===selectedMonth?'active':''}" data-month="${m}">${new Date(m+'-01T12:00Z').toLocaleDateString('en',{month:'short',timeZone:'UTC'})}</button>`).join('')}</div><div class="between" style="padding:12px 4px"><div><div class="label">Total spent</div><div class="amount sm">${money(s.out)}</div><div class="tiny muted">${s.tx.length} recorded payments</div></div><div class="right"><div class="label">Recorded income</div><div class="amount sm">${money(s.income)}</div><div class="tiny muted">Manually entered</div></div></div><div class="month-donut"><span class="donut" style="background:conic-gradient(${gradient})"></span><span class="donut-label">Your spending, organised.<br>Tap a tag to see its payments.<br><strong style="color:#345471">${P.monthLabel(selectedMonth+'-01')}</strong></span></div><div class="between" style="border-bottom:1px solid #edf0f4;padding-bottom:10px"><strong style="font-size:11px">Categories (Tags)</strong><span class="label">Amount</span></div>${s.categories.length?s.categories.map(c=>`<button class="transaction-button" data-category="${c.tag}"><div class="list-row"><span class="round-icon">${icon(tagIcon(c.tag))}</span><div class="grow"><div class="row-name">${c.tag}</div><div class="tag-bar"><i style="width:${c.amount/s.out*100}%"></i></div></div><div class="right"><div class="row-amount">${money(c.amount)}</div><div class="row-meta">${Math.round(c.amount/s.out*100)}% · View ›</div></div></div></button>`).join(''):empty('No payments in this month.','Try another month or make a demo payment.')}<div class="card" style="margin-top:20px"><h3>Recorded spending trend</h3><div class="chart">${[...months].reverse().map(m=>{const val=P.stats(model,m).out,max=Math.max(...months.map(k=>P.stats(model,k).out),1);return `<div class="bar-col"><i style="height:${Math.max(3,val/max*75)}px" title="${money(val)}"></i><span>${new Date(m+'-01T12:00Z').toLocaleDateString('en',{month:'short',timeZone:'UTC'})}</span></div>`}).join('')}</div><p>Months without records show zero.</p></div><div class="note">Includes prototype records and manually recorded external payments. Hidden payments remain included in totals. Does not claim coverage of your bank accounts.</div><button class="secondary" data-nav="digest">Review unconfirmed tags</button><div class="spacer"></div><button class="secondary" data-nav="hub">Open my monthly plan</button>${footer()}</div>`;}

function render(){if(!views[view])view='home';$('demo-date').textContent='SCENARIO · '+dl(model.today,true);$('app').innerHTML=views[view]();const guides={home:['Start where you already pay.','Make an everyday payment, confirm a suggested tag, then set up your month.'],hub:['Your next payment, ready.','A single plan brings the right recipient, due date and reminder together.'],pay:['Review first. Pay with confidence.','The payment flow preserves the recipient and creates one attempt. No real PIN or money movement.'],receipt:['A clear result. A complete record.','Successful payments update the plan immediately. Tagging stays optional.'],summary:['One record. One set of tags.','Every total is derived from the same recorded transactions. No invented completion percentage.'],setup:['Start with what works for you.','Manual setup is fully usable. Detection paths are clearly labelled sample previews.']};const g=guides[view]||['A calmer monthly routine.','Plan → remind → review → pay → track. All connected, with clear demo boundaries.'];if($('guide-title'))$('guide-title').textContent=g[0];if($('guide-copy'))$('guide-copy').textContent=g[1];document.title=(view==='home'?'Payday Hub Prototype':$('screen-heading')?.textContent||'Payday Hub')+' · Paytm Concept';}
function showModal(title,body,handler=null){closeModal(false);lastFocus=document.activeElement;modalHandler=handler;$('modal-root').innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="sheet-close" data-close-modal aria-label="Close dialog">×</button></div>${body}</section></div>`;document.querySelector('.workspace').inert=true;document.querySelector('.sheet-close').focus();}

function beginPay(key){const o=P.resolveOccurrence(model,key),left=P.outstanding(model,o),pending=P.pendingAttempt(model,key);if(pending){navigate('status',{id:pending.id});return;}if(!left)throw Error('This payment is already settled.');draft={occurrenceId:o.id,name:o.payee,recipient:o.recipient,amount:left,tag:o.tag,label:o.name,note:o.note||''};navigate('pay');}

function knownPayeeChecks(a){const saved=model.obligations.find(o=>!o.archived&&o.recipient===a.recipient),past=model.transactions.filter(t=>t.recipient===a.recipient&&t.method==='Paytm'&&t.date<model.today);if(!saved||!past.length)return '';const months=[...new Set(past.map(t=>P.monthKey(t.date)))].sort().map(m=>new Date(m+'-01T12:00Z').toLocaleDateString('en-IN',{month:'short',timeZone:'UTC'}).replace('Sept','Sep'));return '<div class="note green">'+['Verified name: '+E(saved.payee),'Paid '+past.length+' times before ('+months.join(', ')+')',a.amount<=10000000?'Within your ₹1,00,000 UPI limit · Bank status: live (simulated)':'Above your ₹1,00,000 UPI limit · Bank status: live (simulated)'].map(text=>'<div class="flex" style="margin:8px 0">'+icon('check')+'<span>'+text+'</span></div>').join('')+'</div>';}
function bankSheet(attempt){const banks=['HDFC •• 4821','Everyday Demo Bank • 9117','Savings Demo Bank • 2761'];showModal('Pay '+money(attempt.amount)+' from',`<p class="tiny muted">Select a fictional account. No account is connected.</p><div id="bank-list">${banks.map((b,i)=>`<button class="bank ${currentBank===b?'active':''}" data-bank="${i}"><span class="bank-icon">${b.split(' ')[0]}</span><span><strong>${b.split(/ • | •• /)[0]}</strong><small>Savings A/c · ${b.split(/ • | •• /)[1]}</small></span><i class="bank-radio"></i></button>`).join('')}</div><div class="note">Bank balance, payment limits and authorization are simulated. No PIN is collected.</div><label class="field"><span>Choose demo outcome</span><select id="payment-outcome"><option value="success">Success</option><option value="pending">Pending</option><option value="failed">Failed</option></select></label><button class="primary" data-simulate-attempt="${attempt.id}">${icon('shield')} Simulate payment · ${money(attempt.amount)}</button>`,b=>{if(b.dataset.bank!==undefined){currentBank=banks[+b.dataset.bank];document.querySelectorAll('[data-bank]').forEach(el=>el.classList.toggle('active',+el.dataset.bank===+b.dataset.bank));}if(b.dataset.simulateAttempt){b.disabled=true;attempt.bank=currentBank;const outcome=$('payment-outcome').value;const tx=P.finishAttempt(model,attempt.id,outcome);if(tx)tx.note=draft?.note||'';persist();draft=null;navigate(tx?'receipt':'status',{id:tx?.id||attempt.id});}});}
function tagSheet(txId){const t=model.transactions.find(t=>t.id===txId);if(!t)return;tagSelection=t.tag;function body(){return `<p class="tiny muted">${E(t.name)} · ${money(t.amount)}</p><p class="tiny muted">One set of tags across payments, your plan and spending history.</p><div class="tag-grid">${P.TAGS.map(tag=>`<button class="tag-option ${tagSelection===tag?'active':''}" data-tag-choice="${tag}">${icon(tagIcon(tag))}${tag}</button>`).join('')}</div><label class="check"><input id="always-tag" type="checkbox" ${model.rules[t.recipient]?'checked':''}>Always use this tag for ${E(t.name)} in future demo payments.</label><button class="primary" data-save-tag="${t.id}">Tag payment</button>`;}showModal('Tag your payment',body(),b=>{if(b.dataset.tagChoice){tagSelection=b.dataset.tagChoice;document.querySelectorAll('[data-tag-choice]').forEach(el=>el.classList.toggle('active',el.dataset.tagChoice===tagSelection));}if(b.dataset.saveTag){t.tag=tagSelection;t.confirmed=true;if($('always-tag').checked)model.rules[t.recipient]=tagSelection;else delete model.rules[t.recipient];persist();closeModal();render();toast('Tag saved. Your spending summary is updated.');}});}
function manageSheet(key){const o=P.resolveOccurrence(model,key);showModal(E(o.name),`<div class="amount sm">${money(P.outstanding(model,o))}</div><p class="tiny muted">${E(o.payee)} · Due ${dl(o.date)}</p><button class="choice" data-modal-schedule="${key}">${icon('bell')} Set or edit reminder</button><button class="choice" data-modal-edit="${o.templateId}">${icon('edit')} Edit payment details</button><button class="choice" data-modal-external="${key}">${icon('check')} Record as paid elsewhere</button><button class="choice" data-modal-archive="${o.templateId}">${icon('close')} Remove from future plan</button>`,b=>{if(b.dataset.modalSchedule)scheduleSheet(b.dataset.modalSchedule);if(b.dataset.modalEdit){if(model.transactions.some(t=>t.occurrenceId?.startsWith(o.templateId+'@'))||model.attempts.some(a=>a.occurrenceId?.startsWith(o.templateId+'@')&&a.status==='pending'))throw Error('This template has payment history. Add a new payment for changed terms and remove this one from future plans.');setupManual=false;navigate('add',{edit:b.dataset.modalEdit});}if(b.dataset.modalExternal)externalSheet(b.dataset.modalExternal);if(b.dataset.modalArchive){if(model.attempts.some(a=>a.occurrenceId?.startsWith(o.templateId+'@')&&a.status==='pending'))throw Error('Resolve pending payments before removing this plan.');showModal('Remove planned payment?',`<p class="intro-copy">${E(o.name)} will leave the active plan. Recorded payments stay in history.</p><button class="danger-btn" data-confirm-archive="${o.templateId}">Remove from plan</button>`,b=>{if(b.dataset.confirmArchive){model.obligations.find(x=>x.id===o.templateId).archived=true;model.reminders.filter(r=>r.occurrenceId.startsWith(o.templateId+'@')).forEach(r=>r.active=false);persist();closeModal();render();toast('Payment removed from the active plan.');}});}});}

 if(b.dataset.service){if(b.dataset.service==='Rent'){navigate('hub');return;}if(b.dataset.service==='Investments'){navigate('goals');return;}showModal(E(b.dataset.service),`<div class="note">This represents an existing Paytm service. Its commercial flow is outside this monthly-planning prototype.</div><button class="primary" data-go-payday>Plan a related payment</button>`,b=>{if(b.hasAttribute('data-go-payday')){setupManual=false;navigate('add');}});return;}

 case 'salary-form':model.settings.payday=d.payday?Number(d.payday):null;model.incomes=d.income.trim()?[{id:'income-salary',name:'Recorded monthly income',amount:P.parseMoney(d.income),date:P.monthKey(model.today)+'-01',recurring:true}]:[];persist();navigate(model.onboarded?'preferences':'review');break;

 case 'new-payee-form':if(!d.name.trim()||!/^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+$/.test(d.recipient.trim()))throw Error('Enter a name and a fictional UPI ID, such as friend@demo.');draft={name:d.name.trim(),recipient:d.recipient.trim(),amount:null,tag:'Family'};navigate('pay');break;
 case 'reminder-form':P.schedule(model,f.dataset.occurrence,d.date,d.time);persist();closeModal();navigate('reminders');toast('Demo reminder saved. No notification will be sent.');break;
 case 'goal-form':{const s=d.saved.trim();if(!/^\d+(\.\d{1,2})?$/.test(s)||+s>1000000)throw Error('Enter a recorded amount between ₹0 and ₹10,00,000.');model.goals[0].saved=Math.round(+s*100);persist();closeModal();render();toast('Goal progress recorded.');break;}
 case 'filter-form':{const min=d.min.trim()?P.parseMoney(d.min):null,max=d.max.trim()?P.parseMoney(d.max):null;if(min!==null&&max!==null&&min>max)throw Error('Minimum amount must be no greater than maximum.');if(d.from&&d.to&&d.from>d.to)throw Error('Start date must be on or before end date.');let os=P.stats(model).os;if(filterMode==='due')os=os.filter(o=>o.date>=model.today&&o.date<=P.plusDays(model.today,6)&&P.outstanding(model,o)>0);if(filterMode==='unpaid')os=os.filter(o=>P.outstanding(model,o)>0);if(filterMode==='paid')os=os.filter(o=>!P.outstanding(model,o));os=os.filter(o=>(min===null||o.amount>=min)&&(max===null||o.amount<=max)&&(!d.from||o.date>=d.from)&&(!d.to||o.date<=d.to));$('payment-rows').innerHTML=`<div class="tiny muted">${os.length} matching payments · ${money(os.reduce((s,o)=>s+o.amount,0))} planned value</div>`+(os.map(o=>row(o,{manage:true})).join('')||empty('No matches.','Try a different amount or date range.'));f.querySelector('#form-error').hidden=true;break;}
 }
 }catch(err){error(err.message,f);}});

function ensureMonthlyContext(){

 model.mandates??=[{id:'mandate-sip',name:'Monthly SIP',amount:500000,day:7,bank:'HDFC •• 4821',active:true},{id:'mandate-sub',name:'Streaming subscription',amount:49900,day:12,bank:'Everyday Demo Bank • 9117',active:true}];
 model.billReferences??=[{id:'bill-mobile',name:'Mobile recharge',recipient:'mobile.recharge@demo',amount:39900,day:6},{id:'bill-power',name:'Electricity recharge',recipient:'electricity.recharge@demo',amount:120000,day:8}];
}
ensureMonthlyContext();
const bankOptions=['HDFC •• 4821','Everyday Demo Bank • 9117','Savings Demo Bank • 2761'];
const nativeDate=day=>P.monthKey(model.today)+'-'+String(day).padStart(2,'0');
const billPaid=b=>model.transactions.filter(t=>t.recipient===b.recipient&&P.monthKey(t.date)===P.monthKey(model.today)).reduce((sum,t)=>sum+t.amount,0)>=b.amount;
const originalHome=views.home,originalHub=views.hub,originalSalary=views.salary,originalSettings=views.preferences,originalBankSheet=bankSheet;
views.home=function(){const s=P.stats(model);return originalHome().replace('Rent, family & bills. One simple plan.',model.onboarded?`${s.due.length} payments due in 7 days · ${money(s.dueTotal)}`:'Rent, family & help. Start with one payment.');};
views.hub=function(){ensureMonthlyContext();const active=model.mandates.filter(m=>m.active),total=active.reduce((s,m)=>s+m.amount,0),bills=model.billReferences.filter(b=>!billPaid(b)&&nativeDate(b.day)>=model.today&&nativeDate(b.day)<=P.plusDays(model.today,6));const section=`<div class="card"><div class="between"><h3>Preferred payment account</h3><button class="link" data-nav="salary">Change →</button></div><p>${model.settings.defaultBank?E(model.settings.defaultBank):'Not selected · choose an account when you pay'}</p><div class="tiny muted">${model.settings.payday?'Payday reminder: day '+model.settings.payday+' · user-selected date':'Salary details stay optional.'} No salary credit is detected.</div></div><div class="card"><div class="between"><h3>Automatic payments</h3><button class="link" data-nav="mandates">View all →</button></div><p>${active.length} active demo mandates · ${money(total)} per month</p>${active.map(m=>`<button class="transaction-button" data-mandate="${m.id}"><div class="list-row"><span class="round-icon">${icon(m.id==='mandate-sip'?'chart':'calendar')}</span><div class="grow"><div class="row-name">${E(m.name)}</div><div class="row-meta">AutoPay · ${dl(nativeDate(m.day))} · ${E(m.bank)}</div></div><div class="row-amount">${money(m.amount)} ›</div></div></button>`).join('')}<div class="note" style="margin-bottom:0">Visibility only. These demo mandates are separate from manual obligations. No automatic debit occurs and no Pay now button is shown.</div></div><button class="hub-entry" data-nav="bills"><span class="tile-icon">${icon('bills')}</span><span><strong>${bills.length} recharge${bills.length===1?'':'s'} / bills due this week</strong><small>Open existing Recharge & Bills →</small></span></button>`;return originalHub().replace('<div class="card"><div class="between"><h3>Goals & SIP schedule</h3>',section+'<div class="card"><div class="between"><h3>Goals & SIP schedule</h3>').replace('SIPs and goals are not deducted.','AutoPay, recharge references and goals are not deducted.');};
views.salary=function(){const html=originalSalary();const select=`<label class="field"><span>Preferred account for Hub payments (optional)</span><select name="preferredBank"><option value="">Choose when I pay</option>${bankOptions.map(b=>`<option value="${E(b)}" ${b===model.settings.defaultBank?'selected':''}>${E(b)}</option>`).join('')}</select></label><div class="tiny muted">Choose a fictional salary/primary account. You can change accounts before every payment. Existing mandates keep their own linked account.</div>`;return html.replace('<div class="note">Income is a manual record.',select+'<div class="note">Income is a manual record.');};

views.bills=function(){ensureMonthlyContext();return header('Recharge & Bills','hub')+`<div class="content"><span class="banner-mark">EXISTING PAYTM SURFACE · DEMO</span><div class="card" style="margin-top:15px"><h2>Your recharges & bills</h2><p>Payday Hub links here for these services. The biller flow stays in Recharge & Bills.</p>${model.billReferences.map(b=>`<div class="list-row"><span class="round-icon">${icon(b.id==='bill-mobile'?'phone':'bills')}</span><div class="grow"><div class="row-name">${E(b.name)}</div><div class="row-meta">${dl(nativeDate(b.day))} · Fictional saved biller</div>${billPaid(b)?'<span class="status paid">Paid in demo</span>':''}</div><div class="right"><div class="row-amount">${money(b.amount)}</div>${billPaid(b)?'':`<button class="pay-link" data-native-bill="${b.id}">Review bill</button>`}</div></div>`).join('')}</div><div class="note">Bill payments appear in recorded spending. They do not count as migrated P2P obligation value in the Hub’s monthly review.</div><button class="secondary" data-nav="hub">Back to Payday Hub</button>${footer()}</div>`;};
function mandateDetails(id){const m=model.mandates.find(m=>m.id===id);if(!m)return;showModal(E(m.name),`<span class="banner-mark">AUTOPAY · FICTIONAL MANDATE</span><div class="amount">${money(m.amount)}</div><div class="detail"><span>Frequency</span><span>Monthly · ${dl(nativeDate(m.day))}</span></div><div class="detail"><span>Linked account</span><span>${E(m.bank)}</span></div><div class="detail"><span>Status</span><span>${m.active?'Active':'Paused'} in demo</span></div><div class="note">A mandate is authorized separately from a reminder. Changing your Hub account does not change this mandate. No real debit will occur.</div><button class="secondary" data-toggle-demo-mandate>${m.active?'Simulate pause':'Simulate resume'}</button>`,b=>{if(b.hasAttribute('data-toggle-demo-mandate')){m.active=!m.active;persist();closeModal();render();toast('Demo mandate '+(m.active?'resumed.':'paused. No real mandate was changed.'));}});}
function simulateBankMessage(rentOnly=false){ensureMonthlyContext();let phase=rentOnly?0:model.settings.demoSmsPhase%2;const sample=P.suggested(model.today);let o=sample.find(o=>phase?o.id==='ob-parents':o.id==='ob-rent');let existing=model.obligations.find(x=>x.id===o.id);let key=o.id+'@'+o.date;if(phase&&existing&&P.outstanding(model,P.resolveOccurrence(model,key))===0){phase=0;o=sample[0];key=o.id+'@'+o.date;existing=model.obligations.find(x=>x.id===o.id);}model.settings.demoSmsPhase++;persist();const external=phase===1;showModal(external?'Review a sample bank debit':'Review a sample reminder',`<span class="banner-mark">SIMULATED SMS · NO MESSAGE ACCESS</span><div class="tiny muted">${external?dl(model.today)+' · 9:00 PM':'4 Oct · 9:00 PM'}</div><div class="note">${external?'“₹7,000 debited towards Maa via another UPI app.”':'“Your monthly rent of ₹22,000 is due on the 5th.”'}</div><p class="intro-copy">${external?'Confirm whether this fictional debit settles Maa. Nothing changes before your review.':'Review the obligation, then set a reminder or choose when to pay.'}</p><div class="detail"><span>Matched payment</span><span>${E(o.name)} · ${money(o.amount)}</span></div><button class="primary" data-confirm-sample-message>${external?'Confirm paid elsewhere':'Review in my plan'}</button><button class="secondary" data-close-modal>Not now</button>`,b=>{if(b.hasAttribute('data-confirm-sample-message')){if(!existing){model.obligations.push({...o});model.onboarded=true;}if(external){P.markExternal(model,key);persist();navigate('payments');toast('Maa recorded as paid elsewhere. No Paytm payment credit.');}else{persist();navigate('reminder',{id:key});}}});}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.mandate){e.stopImmediatePropagation();mandateDetails(b.dataset.mandate);return;}
 if(b.dataset.nativeBill){e.stopImmediatePropagation();const bill=model.billReferences.find(x=>x.id===b.dataset.nativeBill);if(billPaid(bill))throw Error('This demo bill is already paid.');const already=model.transactions.filter(t=>t.recipient===bill.recipient&&P.monthKey(t.date)===P.monthKey(model.today)).reduce((sum,t)=>sum+t.amount,0);draft={name:bill.name,recipient:bill.recipient,amount:Math.max(0,bill.amount-already),tag:'Bills',note:'Recharge & Bills demo'};navigate('pay');return;}

 if(b.dataset.action==='rent-sms'){e.stopImmediatePropagation();simulateBankMessage(true);return;}

ing ›</small></button><div class="stat"><div class="label">Recorded as paid</div><div class="amount">${money(s.total-s.remaining)}</div><small>Against this month’s plan</small></div><button class="stat" data-action="due-list"><div class="label">Due in next 7 days</div><div class="amount">${money(s.dueTotal)}</div><small>${s.due.length} payment${s.due.length===1?"":"s"} coming up ›</small></button></div>${latest?`<div class="note green" style="margin-top:0">${icon('check')} <strong>${E(s.os.find(o=>o.id===latest.occurrenceId)?.name||latest.name)} payment recorded.</strong> Your plan and spending summary are updated.</div>`:''}<div class="card"><div class="between"><h2>Coming up next</h2><button class="link" data-nav="payments">See all ›</button></div>${unpaid.length?unpaid.slice(0,2).map(o=>row(o)).join(''):empty('All caught up.','Your planned payments are settled for this month.')}<button class="link" data-action="add-payment">＋ Add a payment</button></div><div class="card"><div class="between"><h2>Your spending snapshot</h2><button class="link" data-nav="summary">Spend Summary ›</button></div><div class="mini-summary"><div><span>Total spent this month</span><strong>${money(s.out)}</strong></div><div><span>Recorded income left</span><strong>${model.incomes.length?money(s.recordedLeft):'—'}</strong></div></div><div class="tiny muted">Recorded income and payments only. This is not your bank balance.</div><button class="summary-cue" data-nav="summary">${icon('chart')}<span><strong>Monthly AI Spend Summary</strong><small>View categories, payments and spending trends</small></span><span>›</span></button>${tagged?`<button class="link" data-nav="digest">${tagged} payments to review tags ›</button>`:''}</div><div class="card"><div class="between"><h3>Reminders & AutoPay</h3><button class="link" data-nav="reminders">Manage ›</button></div><div class="list-row"><span class="round-icon">${icon('bell')}</span><div class="grow"><div class="row-name">Payment reminders</div><div class="row-meta">${model.reminders.filter(r=>r.active).length+(model.savedReminders||[]).filter(r=>r.active).length} saved reminders</div></div><button class="link" data-nav="reminders">View ›</button></div><div class="between"><span class="label">Automatic payments</span><button class="link" data-nav="mandates">View mandates ›</button></div></div><div class="card"><div class="between"><h3>Goals & investments</h3><button class="link" data-nav="goals">View ›</button></div><p>Your goal progress and SIP schedule, in one place.</p></div><button class="secondary" data-nav="home">Back to Paytm home</button>${footer('Figures use fictional demo data. Payments are simulated.')}<button class="link" style="display:block;margin:12px auto" data-action="reset-confirm">Reset demo</button></div>`;};
